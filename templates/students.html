<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>Students List</h1>

<table border="1" align="center" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Update</th>
    <th>Delete</th>
</tr>

{% for student in students %}

<tr>

    <td>{{ student[0] }}</td>
    <td>{{ student[1] }}</td>
    <td>{{ student[2] }}</td>

<td>
    <a href="/update/{{ student[0] }}">
        <button>Update</button>
    </a>
</td>

<td>
    <a href="/delete/{{ student[0] }}">
        <button>Delete</button>
    </a>
</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/">Home</a>

</body>
</html>
